AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap: GitHub OIDC provider and the role CI assumes to deploy.
  Deploy this once by hand, then put the RoleArn output into the GitHub secret
  AWS_DEPLOY_ROLE_ARN. Nothing here is managed by CI, on purpose -- CI must not
  be able to widen its own permissions.

  aws cloudformation deploy \
    --template-file bootstrap-oidc.yaml \
    --stack-name tmwatch-oidc \
    --capabilities CAPABILITY_NAMED_IAM \
    --parameter-overrides GitHubOwner=stranger480908 GitHubRepo=td_watch_service

Parameters:
  GitHubOwner:
    Type: String
  GitHubRepo:
    Type: String
  GitHubEnvironment:
    Type: String
    Default: production
    Description: >
      Must match the `environment:` key on the deploy job in ci.yml. When a job
      declares an environment, GitHub changes the OIDC subject claim from
      repo:OWNER/REPO:ref:refs/heads/main to repo:OWNER/REPO:environment:NAME.
      Trusting only the ref would make every deploy fail with a confusing
      AssumeRole denial.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set false if this account already has a GitHub OIDC provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS no longer validates this for well-known IdPs, but the property is
      # still required by CloudFormation.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tmwatch-github-deploy
      Description: Assumed by GitHub Actions to deploy the tmwatch SAM stack.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Scoped to this repo and this environment. A wildcard on sub
              # would let any repo in any org assume this role.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}*/${GitHubRepo}*:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SAM drives everything through CloudFormation.
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:TagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tmwatch/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31

              # sam deploy --resolve-s3 creates and uses a managed artifact bucket.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:DeleteBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default*
                  - !Sub arn:${AWS::Partition}:s3:::tmwatch-*

              - Effect: Allow
                Action:
                  - lambda:*
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - events:*
                  - sns:*
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                  - budgets:*
                  - ec2:CreateVpcEndpoint
                  - ec2:DeleteVpcEndpoints
                  - ec2:ModifyVpcEndpoint
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                Resource: '*'

              # Lambda execution roles. Confined to this stack's name prefix so
              # a compromised workflow cannot mint an arbitrary admin role.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tmwatch-*

Outputs:
  RoleArn:
    Description: Put this in the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  SubjectClaim:
    Description: The OIDC subject this role trusts. Compare with the failure message if AssumeRole is denied.
    Value: !Sub repo:${GitHubOwner}*/${GitHubRepo}*:environment:${GitHubEnvironment}
